plugins { id 'com.android.application' }
buildDir=new File(rootProject.qlcgBuildRoot, 'app-build')
android {
 namespace 'org.qianlinchaguan.game'
 compileSdk 35
 ndkVersion '28.2.13676358'
 defaultConfig {
  applicationId 'org.qianlinchaguan.game'
  minSdk 29
  targetSdk 35
  versionCode 301
  versionName '0.3.1'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DQLCG_ANDROID_GAME=ON'; targets 'qlcg_game' } }
 }
 buildFeatures { prefab true }
 externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1'; buildStagingDirectory new File(rootProject.qlcgBuildRoot, 'native') } }
 sourceSets { main { java.srcDirs += '../bridge'; assets.srcDirs=[new File(rootProject.qlcgBuildRoot, 'assets')] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'); implementation 'androidx.games:games-activity:3.0.5'; implementation 'androidx.appcompat:appcompat:1.7.0' }
